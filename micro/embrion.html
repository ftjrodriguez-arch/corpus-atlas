<style>
html,body{margin:0;height:100%;background:#0b1120;color:#e2e8f0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}

.pan{background:rgba(15,23,42,.88);border:1px solid #334155;border-radius:10px}
#top{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;pointer-events:none}

#ttl{margin:0 8px 0 2px;font:700 16px system-ui,sans-serif;color:#f8fafc;text-shadow:0 1px 3px #000,0 0 8px #0b1120}
button{font:inherit;color:#e2e8f0;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}

#info{position:absolute;left:10px;bottom:10px;width:min(420px,calc(100% - 20px));padding:10px 14px;line-height:1.45;max-height:46%;overflow:auto;box-sizing:border-box}

#lbs{position:absolute;inset:0;pointer-events:none}

#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;pointer-events:none}
@media (max-width:640px){#info{max-height:40%;font-size:13px}#bar{bottom:auto;top:96px}}
</style></head><body>

const $=id=>document.getElementById(id),L=()=>T[LANG];
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:/[?&]qa\b/.test(location.search)});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,1,0.05,400);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
scene.add(new THREE.HemisphereLight(0xffe9e0,0x24161c,0.55));
const key=new THREE.DirectionalLight(0xfff2e6,0.95);scene.add(key);
const rim=new THREE.DirectionalLight(0x8fb8ff,0.7);scene.add(rim);
/* piel embrionaria: rosada, algo translúcida y húmeda */
const MAT=new THREE.MeshPhysicalMaterial({color:0xd89a88,roughness:0.5,metalness:0,clearcoat:0.35,clearcoatRoughness:0.5,sheen:0.6,sheenColor:new THREE.Color(0xff9a8a),sheenRoughness:0.5,side:THREE.DoubleSide});
const M={};let cur=+Q.get('s')||16,cmp=false,dirty=true;
if(!ST.some(x=>x.s===cur))cur=16;
const orb={th:0.5,ph:1.45,r:60,tx:0,ty:0};
const crl=x=>(x.mm[0]+x.mm[1])/2;
function layout(){let x0=0;const gap=4,tot=ST.reduce((a,x)=>a+crl(x)*0.7+gap,-gap);
  for(const x of ST){const m=M[x.s];if(!m)continue;m.scale.setScalar(crl(x));const w=crl(x)*0.7;
    if(cmp){m.visible=true;m.position.set(-tot/2+x0+w/2,crl(x)/2-crl(ST[5])/2,0);x0+=w+gap;}
    else{m.visible=x.s===cur;m.position.set(0,0,0);}}
  const c=ST.find(x=>x.s===cur),tg=Math.tan(cam.fov*Math.PI/360),estrecho=cam.aspect<0.8;
  if(cmp){/* la fila entera cabe a lo ancho y queda por encima del panel */
    orb.r=Math.max(tot*1.12/(2*tg*cam.aspect),crl(ST[5])*1.5/(2*tg)*1.9);orb.th=0;orb.ph=1.5;orb.tx=0;orb.ty=-orb.r*tg*(estrecho?0.30:0.22);}
  else{orb.r=crl(c)*(estrecho?5.2:3.9);orb.tx=0;orb.ty=-orb.r*tg*(estrecho?0.42:0.12);}
  dirty=true;}
function ui(){document.documentElement.lang=LANG;$('ttl').textContent=L().ttl;$('load').textContent=Object.keys(M).length?'':L().carga;
  const st=$('st');st.innerHTML='';for(const x of ST){const b=document.createElement('button');b.type='button';b.textContent=x.s;b.title=L().est+' '+x.s;b.setAttribute('aria-pressed',x.s===cur);if(x.s===cur&&!cmp)b.className='on';
    b.onclick=()=>{cur=x.s;cmp=false;layout();ui();};st.append(b);}
  const e=$('esc');e.textContent=cmp?L().uno:L().esc;e.className=cmp?'on':'';
  const c=ST.find(x=>x.s===cur),h=L().h[c.s];
  $('info').innerHTML='<h2>'+(cmp?L().esc:L().est+' '+c.s)+'</h2><div class="sub">'+(cmp?L().est+' 12 → 23 · '+L().sem+' 4 → 8 · '+L().len+' 3–31 '+L().mm+'</div>'+'<div hidden>':'')+L().dia+' ≈ '+c.d+' · '+L().sem+' '+Math.ceil(c.d/7)+' · '+L().len+' '+c.mm[0]+'–'+c.mm[1]+' '+L().mm+'</div>'+(cmp?'':'<ul>'+h.map(t=>'<li>'+t+'</li>').join('')+'</ul>')+'<div class="src">'+L().src+'</div>';
  dirty=true;}
$('esc').onclick=()=>{cmp=!cmp;layout();ui();};
function size(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();if(cmp)layout();dirty=true;}
addEventListener('resize',size);
/* órbita: arrastrar gira, rueda o pellizco acerca, botón derecho o dos dedos desplaza */
const P=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY,e.button]);});
cv.addEventListener('pointerup',e=>{P.delete(e.pointerId);pd=0;});cv.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pd=0;});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(P.size>=2){const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)orb.r*=pd/d;pd=d;}
  else if(p[2]===2||e.shiftKey){const k=orb.r*0.0016;orb.tx-=dx*k;orb.ty+=dy*k;}
  else{orb.th-=dx*0.008;orb.ph=Math.min(3.0,Math.max(0.14,orb.ph-dy*0.008));}
  orb.r=Math.min(400,Math.max(3,orb.r));dirty=true;});
cv.addEventListener('wheel',e=>{e.preventDefault();orb.r=Math.min(400,Math.max(3,orb.r*Math.exp(e.deltaY*0.0012)));dirty=true;},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('keydown',e=>{const i=ST.findIndex(x=>x.s===cur);if(e.key==='ArrowRight'&&i<5){cur=ST[i+1].s;cmp=false;layout();ui();}if(e.key==='ArrowLeft'&&i>0){cur=ST[i-1].s;cmp=false;layout();ui();}});
const V=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);if(!dirty)return;dirty=false;
  cam.position.set(orb.tx+orb.r*Math.sin(orb.ph)*Math.sin(orb.th),orb.ty+orb.r*Math.cos(orb.ph),orb.r*Math.sin(orb.ph)*Math.cos(orb.th));cam.lookAt(orb.tx,orb.ty,0);
  key.position.copy(cam.position).add(V.set(orb.r*0.5,orb.r*0.7,0));rim.position.set(-cam.position.x,cam.position.y*0.3,-cam.position.z);
  R.render(scene,cam);
  /* barra de escala: milímetros reales a la distancia del modelo */
  const hpx=cv.clientHeight,mmpx=hpx/(2*orb.r*Math.tan(cam.fov*Math.PI/360));let mm=[1,2,5,10,20,50].find(v=>v*mmpx>=50)||50;
  $('barB').style.width=Math.round(mm*mmpx)+'px';$('barT').textContent=mm+' '+L().mm;
  const lb=$('lbs');lb.innerHTML='';if(cmp)for(const x of ST){const m=M[x.s];if(!m)continue;V.set(m.position.x,m.position.y-crl(x)*0.56,0).project(cam);
    const s=document.createElement('span');s.textContent=x.s+' · '+L().dia+' '+x.d;s.style.left=((V.x+1)/2*cv.clientWidth)+'px';s.style.top=((1-V.y)/2*hpx)+'px';lb.append(s);}}
addEventListener('message',e=>{const d=e.data||{};if(d.embrion==='lang'&&T[d.lang]){LANG=d.lang;ui();}if(d.embrion==='stage'&&ST.some(x=>x.s===+d.s)){cur=+d.s;cmp=false;layout();ui();}});
size();ui();frame();
const dl=new THREE.DRACOLoader();dl.setDecoderPath('../draco/');const gl=new THREE.GLTFLoader();gl.setDRACOLoader(dl);
gl.load('embrion.glb',g=>{g.scene.traverse(o=>{if(!o.isMesh)return;const n=+((o.name.match(/cs(\d+)/)||(o.parent&&o.parent.name.match(/cs(\d+)/))||[])[1]);if(!n)return;
    o.geometry.computeVertexNormals();const m=new THREE.Mesh(o.geometry,MAT);M[n]=m;scene.add(m);});
  layout();ui();window.__listo=true;},undefined,()=>{$('load').textContent='⚠';});
</script></body></html>
